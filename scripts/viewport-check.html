<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace — responsive layout check</title><style>body{margin:0;height:100vh;overflow:hidden;background:#dde4dd;color:#183f35;font:14px system-ui}header{padding:16px;display:flex;gap:16px;align-items:center;position:sticky;top:0;background:#f7f6f0;z-index:2}label{display:flex;gap:8px;align-items:center}select{padding:8px;border:1px solid #9caf9e;border-radius:4px}main{padding:20px;overflow:auto;height:calc(100vh - 66px)}iframe{display:block;width:390px;height:calc(100vh - 110px);border:1px solid #a8b8aa;background:white;margin:0 auto;box-shadow:0 8px 25px #1233}p{font-size:11px;margin:0;color:#647261}</style><header><strong>Trace layout check</strong><label>Viewport width<select id="width"><option value="320">320px</option><option value="390" selected>390px</option><option value="768">768px</option><option value="1168">1168px</option></select></label><p>Real Chromium rendering in a sized iframe. This does not emulate a physical phone or touch input.</p></header><main><iframe title="Trace preview" src="/"></iframe></main><script>document.querySelector('select').addEventListener('change',e=>document.querySelector('iframe').style.width=e.target.value+'px');</script></html>
