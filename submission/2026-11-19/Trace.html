// scenarios.js
const MODEL_VERSION = 'trace-intervals-1.0';
const METHOD = 'simulated-colorimetry';
const UNIT = 'mg/L as P';
const SITES = [
 {id:'R',name:'Reference reach',short:'Reference',kind:'reference',mask:0,cost:1,x:108,y:120,description:'A separate reference reach. A reading outside the reference band challenges the baseline assumption.'},
 {id:'A',name:'West inlet',short:'West',kind:'branch',mask:1,cost:1,x:185,y:270,description:'Samples branch A before it joins the central channel. Separates explanations that include the west branch.'},

 {id:'C',name:'East inlet',short:'East',kind:'branch',mask:4,cost:1,x:651,y:245,description:'Samples branch C before lake entry. Separates explanations that include the east branch.'},
 {id:'J',name:'Two-branch junction',short:'Junction',kind:'junction',mask:3,cost:2,x:363,y:337,description:'A combined sample from A and B. Useful when individual branches are inaccessible; cannot by itself distinguish A from B.'},
 {id:'L',name:'Lake entry',short:'Lake entry',kind:'outlet',mask:7,cost:1,x:482,y:435,description:'Combined inflow before broad lake mixing. Historical excess here starts the investigation.'}
];
const HYPOTHESES = Array.from({length:8},(_,id)=>({id, name:id===0?'No modeled branch':SITES.filter(s=>s.kind==='branch'&&(s.mask&id)).map(s=>s.short).join(' + ')}));

 {id:'first-signal',name:'A signal upstream',tag:'Start here',subtitle:'One lake. Three inlets. Four test credits.',description:'A reference reading is low, but the combined inflow is elevated. Find which modeled upstream explanations still fit.',budget:4,access:{}},
 {id:'two-signals',name:'More than one answer',tag:'Multiple branches',subtitle:'A single-source assumption would miss the story.',description:'Follow the evidence when more than one branch may contribute. Trace keeps multi-branch explanations in play.',budget:4,access:{}},
 {id:'restricted',name:'The closed footpath',tag:'Access constraints',subtitle:'The most useful site is not always reachable.',description:'West is blocked and north access is unverified. Explore what the remaining sites can—and cannot—resolve.',budget:4,access:{A:'blocked',B:'unknown'}},
 {id:'ambiguous',name:'The uncertain reading',tag:'Wide intervals',subtitle:'A coarse measurement must stay coarse.',description:'The simulated method returns broad intervals. Watch the system preserve uncertainty instead of inventing precision.',budget:4,access:{}},
 {id:'contradiction',name:'When the story breaks',tag:'Model mismatch',subtitle:'Conflicting evidence should change the conclusion.',description:'The downstream observation and subsequent upstream samples disagree with the model. Investigate until the assumptions fail.',budget:4,access:{}}
];
function siteById(id) { return SITES.find(s=>s.id===id); }
function scenarioById(id) { return SCENARIOS.find(s=>s.id===id); }
function hypothesisName(id) { return HYPOTHESES.find(h=>h.id===id)?.name ?? 'Unknown'; }


// model.js

function expectedBand(hypothesis, siteId) {
 const site=siteById(siteId);
 if (!site || !Number.isInteger(hypothesis) || hypothesis<0 || hypothesis>7) throw new Error('Unknown model input');
 return (hypothesis & site.mask) ? [0.4,0.9] : [0.03,0.12];
}
function latest(observation) { return observation.revisions.at(-1); }
function compatible(h,site,low,high,tolerance=0) {
 const [a,b]=expectedBand(h,site);
 // A tiny arithmetic guard preserves mathematical endpoint overlap. It is not scientific uncertainty.
 const epsilon=1e-12;
 return high+tolerance+epsilon>=a && low-tolerance-epsilon<=b;
}
function spentCredits(state) {
 return state.observations.filter(o=>o.origin==='collected').reduce((sum,o)=>sum+siteById(o.siteId).cost,0);
}
function compatibleHypotheses(state) {
 return HYPOTHESES.map(h=>h.id).filter(h=>state.observations.every(o=>{
  const r=latest(o);
  return r.review || compatible(h,o.siteId,r.low,r.high,state.tolerance);
 }));
}
function candidatesFor(state,remaining) {
 const available=state.budget-spentCredits(state);
 const sampled=new Set(state.observations.map(o=>o.siteId));
 return SITES.filter(s=>!sampled.has(s.id)&&state.access[s.id]==='open'&&s.cost<=available).map(site=>{
  // Partition the entire nonnegative reading-center line at compatibility boundaries.
  // A predicted reading has half-width 0.03; user-entered intervals may be wider.
  const radius=.03+state.tolerance;
  const boundaries=[0,...remaining.flatMap(h=>{const [l,u]=expectedBand(h,site.id);return [Math.max(0,l-radius),u+radius];})].sort((a,b)=>a-b);
  const centers=[...boundaries,...boundaries.slice(1).map((v,i)=>(v+boundaries[i])/2)];
  const worstRemaining=Math.max(...centers.map(c=>remaining.filter(h=>compatible(h,site.id,Math.max(0,c-.03),c+.03,state.tolerance)).length));
  const low=remaining.filter(h=>!(h&site.mask)).length;
  const high=remaining.length-low;
  return {site,worstRemaining,guaranteedReduction:remaining.length-worstRemaining,low,high};
 }).filter(a=>a.guaranteedReduction>0).sort((a,b)=>a.worstRemaining-b.worstRemaining||a.site.cost-b.site.cost||a.site.id.localeCompare(b.site.id));
}

 const remaining=compatibleHypotheses(state);
 if(state.conditionsChanged || remaining.length<2 || state.observations.some(o=>latest(o).review)) return [];
 return candidatesFor(state,remaining);
}
function analyze(state) {
 const remaining=compatibleHypotheses(state), spent=spentCredits(state), available=state.budget-spent;
 const actions=rankActions(state);
 let status='active';
 if(state.conditionsChanged) status='conditions';
 else if(state.observations.some(o=>latest(o).review)) status='review';
 else if(!remaining.length) status='conflict';
 else if(remaining.length===1) status='narrowed';
 else if(available<1) status='budget';
 else if(!actions.length) status='inconclusive';
 const verificationPending=status==='narrowed'?SITES.filter(site=>site.kind==='branch'&&(remaining[0]&site.mask)).flatMap(site=>{
  const observation=state.observations.find(o=>o.siteId===site.id),r=observation&&latest(observation);
  if(r&&!compatible(0,site.id,r.low,r.high,state.tolerance))return [];
  const reason=observation?'broad':state.access[site.id]!=='open'?state.access[site.id]:site.cost>available?'budget':'ready';
  return [{site,band:expectedBand(remaining[0],site.id),feasible:reason==='ready',reason,observationId:observation?.id||null}];
 }):[];

 if(verification)status='crosscheck';
 return {remaining,spent,available,actions,status,verification,verificationPending};
}
function verificationMessage(v) {
 const name=v.site.name;
 if(v.reason==='broad')return name+': its interval cannot distinguish low from elevated. Review the observation; a genuinely more precise test requires a new sampling session.';
 if(v.reason==='budget')return name+': still unmeasured; its cross-check exceeds the remaining budget.';
 if(v.reason==='blocked'||v.reason==='unknown')return name+': still unmeasured; access is '+v.reason+'.';
 return name+': not measured yet. Test this prediction before closing the case.';
}
const STATUS = {
 conditions:{label:'Conditions changed',title:'This session is paused.',text:'The underlying sampling conditions have changed. Existing readings should not be combined with a new session. Export this case, then start fresh.'},
 crosscheck:{label:'Cross-check pending',title:'One explanation remains. Its check is pending.',text:'Agreement by exclusion needs a discriminating observation. Preserve the unresolved cross-check; a matching model still does not prove a cause.'},
 active:{label:'Investigation open',title:'Let the next sample do more.',text:'Compare the explanations, then collect the most useful accessible sample.'},
 narrowed:{label:'Model narrowed',title:'One explanation fits. Keep the caveat.',text:'One modeled explanation fits the current readings. This is not proof of a pollution source; unmodeled causes, timing and transport can change the result.'},
 conflict:{label:'Model mismatch',title:'The evidence does not fit.',text:'No modeled explanation fits all accepted readings. Check timing, reference conditions, methods and recorded intervals. Do not attribute a source.'},
 review:{label:'Review needed',title:'Check the flagged reading first.',text:'A reading is marked for review. Advice is paused until it is corrected or accepted; flagged readings do not constrain the candidate set.'},
 budget:{label:'Budget reached',title:'Save the uncertainty, too.',text:'No test credits remain. Export the evidence and unresolved alternatives, or explicitly increase the scenario budget.'},
 inconclusive:{label:'Cannot narrow further',title:'The next step needs better evidence.',text:'No affordable, accessible, unmeasured site offers a guaranteed distinction under this model. Revisit access, precision, or the model with a qualified coordinator.'}
};


// state.js


const MAX_BACKUP_BYTES=4*1024*1024;
const now=()=>new Date().toISOString();
const clone=s=>structuredClone(s);
const fail=message=>{throw new Error(message);};
function validReading(r) {
 if(!r||!Number.isFinite(r.low)||!Number.isFinite(r.high)||r.low<0||r.high>10||r.low>r.high) fail('Enter a valid interval from 0 to 10, with lower ≤ upper.');
 if(r.method!==METHOD) fail('This model only supports the declared simulated method.');
 if(typeof r.note!=='string'||r.note.length>1000||typeof r.review!=='boolean') fail('Invalid reading note or review flag.');
}
function event(s,type,detail) { s.history.push({time:now(),type,detail}); if(s.history.length>200) fail('History limit reached. Export this case and start a new one.'); }
function stampReading(r) {validReading(r);return {...r,time:now()};}
function createCase(scenarioId='first-signal') {
 const scenario=scenarioById(scenarioId); if(!scenario) fail('Unknown scenario.');
 const time=now();
 return {schema:'trace.case.v1',modelVersion:MODEL_VERSION,scenarioId,createdAt:time,conditionsChanged:false,budget:scenario.budget,tolerance:0,
  access:Object.fromEntries(SITES.map(s=>[s.id,scenario.access[s.id]||'open'])),
  observations:[['R',.06,.1],['L',.54,.6]].map(([siteId,low,high])=>({id:'sample-'+siteId,siteId,origin:'historical',revisions:[{low,high,method:METHOD,note:'Synthetic starting observation; supplied at no additional test cost.',review:false,time}]})),
  history:[{time,type:'created',detail:'Started '+scenario.name+' with two synthetic historical observations.'}]};
}
function recordSample(state,siteId,r) {
 validReading(r);if(state.conditionsChanged)fail('Conditions changed: export this case and start a new session before sampling.');const s=clone(state),site=siteById(siteId);
 if(!site) fail('Unknown site.');
 if(s.observations.some(o=>o.siteId===siteId)) fail('This site already has a sample. Edit its current observation instead.');
 if(s.access[siteId]!=='open') fail('Confirm open access before recording this sample.');
 if(spentCredits(s)+site.cost>s.budget) fail('This sample exceeds the remaining budget.');
 s.observations.push({id:'sample-'+siteId,siteId,origin:'collected',revisions:[stampReading(r)]});
 event(s,'sample','Recorded '+site.name+' · '+site.cost+' test credit(s).');return s;
}
function reviseSample(state,id,r) {
 validReading(r);const s=clone(state),o=s.observations.find(x=>x.id===id);if(!o) fail('Observation not found.');
 if(o.revisions.length>=50) fail('Revision limit reached.');

}
function setAccess(state,id,access) {
 if(!siteById(id)||!['open','blocked','unknown'].includes(access)) fail('Invalid access condition.');
 const s=clone(state);s.access[id]=access;event(s,'access',siteById(id).name+' access → '+access);return s;
}
function setBudget(state,budget) {
 if(!Number.isInteger(budget)||budget<0||budget>20) fail('Budget must be a whole number from 0 to 20.');
 if(budget<spentCredits(state)) fail('Budget cannot be below credits already spent.');
 const s=clone(state);s.budget=budget;event(s,'budget','Total budget → '+budget+' credits.');return s;
}
function setTolerance(state,tolerance) {
 if(!Number.isFinite(tolerance)||tolerance<0||tolerance>.2) fail('Additional tolerance must be from 0 to 0.20.');

}
function markConditionsChanged(state) {const s=clone(state);if(!s.conditionsChanged){s.conditionsChanged=true;event(s,'conditions','Underlying water conditions or sampling session changed; new sampling paused.');}return s;}
function serializeCase(s) { return JSON.stringify(s,null,2); }
function importCase(text) {
 if(typeof text!=='string'||new TextEncoder().encode(text).byteLength>MAX_BACKUP_BYTES) fail('Backup is too large.');
 let s;try{s=JSON.parse(text);}catch{fail('This is not a valid JSON backup.');}
 if(s?.schema!=='trace.case.v1'||s.modelVersion!==MODEL_VERSION) fail('Unsupported backup schema or model version.');
 if(s.conditionsChanged!==undefined&&typeof s.conditionsChanged!=='boolean')fail('Invalid session condition flag.');
 if(!scenarioById(s.scenarioId)) fail('Unknown scenario.');
 const validTime=t=>typeof t==='string'&&t.length<40&&Number.isFinite(Date.parse(t));
 if(!validTime(s.createdAt)) fail('Invalid creation time.');
 if(!Number.isInteger(s.budget)||s.budget<0||s.budget>20) fail('Invalid budget.');
 if(!Number.isFinite(s.tolerance)||s.tolerance<0||s.tolerance>.2) fail('Invalid tolerance.');
 if(!s.access||SITES.some(site=>!['open','unknown','blocked'].includes(s.access[site.id]))) fail('Invalid access data.');
 if(!Array.isArray(s.observations)||s.observations.length<2||s.observations.length>6) fail('Invalid observations.');
 const seen=new Set();
 for(const o of s.observations) {
  if(!siteById(o.siteId)||seen.has(o.siteId)||o.id!=='sample-'+o.siteId) fail('Invalid or duplicate observation.');
  seen.add(o.siteId);
  if(o.origin!==(['R','L'].includes(o.siteId)?'historical':'collected')) fail('Invalid sample origin.');
  if(!Array.isArray(o.revisions)||!o.revisions.length||o.revisions.length>50) fail('Invalid revisions.');
  for(const r of o.revisions) {validReading(r);if(!validTime(r.time)) fail('Invalid reading time.');}
 }
 if(!seen.has('R')||!seen.has('L')) fail('Starting observations missing.');
 if(spentCredits(s)>s.budget) fail('Backup budget is below credits spent.');
 if(!Array.isArray(s.history)||s.history.length<1||s.history.length>200||s.history.some(h=>!validTime(h.time)||typeof h.type!=='string'||h.type.length>30||typeof h.detail!=='string'||h.detail.length>1000)) fail('Invalid history.');
 // Reconstruct known fields; imported arbitrary properties never become application state.
 return {schema:s.schema,modelVersion:s.modelVersion,scenarioId:s.scenarioId,createdAt:s.createdAt,conditionsChanged:s.conditionsChanged||false,budget:s.budget,tolerance:s.tolerance,
 access:Object.fromEntries(SITES.map(x=>[x.id,s.access[x.id]])),observations:s.observations.map(o=>({id:o.id,siteId:o.siteId,origin:o.origin,revisions:o.revisions.map(r=>({low:r.low,high:r.high,method:r.method,note:r.note,review:r.review,time:r.time}))})),history:s.history.map(h=>({time:h.time,type:h.type,detail:h.detail}))};
}


// simulator.js
// Demo outcomes live outside the inference engine. Planner receives observations only.


function simulatedReading(scenarioId,siteId) {
 const masks={'first-signal':2,'two-signals':5,restricted:2,ambiguous:2,contradiction:0};
 if(!(scenarioId in masks)) throw new Error('Unknown simulator scenario');
 if(scenarioId==='ambiguous') return {low:0,high:.95,method:METHOD,note:'Synthetic coarse-method reading; keep the full interval.',review:false};
 const [l,h]=expectedBand(masks[scenarioId],siteId),v=(l+h)/2;
 return {low:Number(Math.max(0,v-.03).toFixed(3)),high:Number((v+.03).toFixed(3)),method:METHOD,note:'Generated by the fictional scenario. No field measurement.',review:false};
}

function investigation(a){return `${hero(a)}<div class="workspace-grid"><section class="map-panel"><div class="map-heading"><div><p class="eyebrow">MILLBROOK BASIN</p><span>Three branches. One shared lake.</span></div><span class="status-pill ${a.status}"><i></i>${STATUS[a.status].label}</span></div>${mapSVG(state,selected,a.actions[0]?.site.id||(a.verification?.feasible?a.verification.site.id:null))}<div class="compact-location"><label for="location-picker">Choose a sampling location</label><select id="location-picker">${SITES.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${s.id} · ${e(s.name)}${state.access[s.id]!=='open'?' · '+state.access[s.id]:''}</option>`).join('')}</select></div>${selectedCard(a)}<div class="map-legend"><span><i class="legend-dot recorded"></i> Reading recorded</span><span><i class="legend-dot next"></i> Recommended next</span><span><i class="legend-dot unavailable"></i> Access unconfirmed / blocked</span></div></section>${recommend(a)}</div>${hypotheses(a)}<section class="below-grid"><div class="next-options"><div class="section-heading"><h2>Other ways forward</h2><span class="muted">Compared on the same evidence</span></div>${a.actions.slice(1).length?a.actions.slice(1).map(ac=>`<button class="option-row" data-site="${ac.site.id}"><span class="site-letter light">${ac.site.id}</span><span><strong>${e(ac.site.name)}</strong><small>${ac.site.cost} test credit${ac.site.cost===1?'':'s'} · worst-case ${ac.worstRemaining} explanations</small></span>${icon('arrow')}</button>`).join(''):`<p class="empty-copy">No further informative alternatives under the current access, budget and model.</p>`}</div><div class="field-note"><span class="note-number">FIELD NOTE / 001</span><h3>A useful answer can be<br><em>“we don’t know yet.”</em></h3><p>Every conclusion stays linked to its readings. Change an observation and Trace revisits the whole case.</p><button class="text-button" data-tab="notebook">Open the evidence notebook ${icon('arrow')}</button></div></section>`;}
function notebook(a){return `<section class="page-title"><p class="eyebrow">THE EVIDENCE NOTEBOOK</p><h1>Nothing gets lost.<br><em>Especially the uncertainty.</em></h1><p>Current readings drive the model. Original readings remain in the record.</p></section><div class="toolbar"><span>${state.observations.length} sample locations · ${state.observations.reduce((n,o)=>n+o.revisions.length,0)} recorded versions</span><div><button class="button secondary small" data-action="import">Import backup</button><button class="button secondary small" data-action="backup">${icon('download')} Download backup</button></div></div><div class="evidence-list">${state.observations.map(o=>{const r=latest(o),site=siteById(o.siteId);return `<article class="evidence-card"><div class="evidence-main"><span class="site-letter">${site.id}</span><div><h2>${e(site.name)}</h2><p>${o.origin==='historical'?'Starting evidence':'Collected in this case'} · ${time(r.time)} · ${o.revisions.length} version${o.revisions.length===1?'':'s'}</p></div><div class="reading-value">${interval(r)}<small>${UNIT}</small></div><span class="tag ${r.review?'warning':''}">${r.review?'Review needed':'Accepted'}</span><button class="button secondary small" data-edit="${o.id}">Edit reading</button></div><p class="reading-note">${e(r.note)||'No note added.'}</p><details><summary>Reading history & method</summary><p class="fineprint">Method: ${METHOD}. All data in this workspace are synthetic. Only the latest accepted revision constrains the model.</p>${o.revisions.map((v,i)=>`<div class="revision-row"><span>v${i+1} ${i===o.revisions.length-1?'· Current':'· Superseded'}</span><strong>${interval(v)} ${UNIT}</strong><span>${e(v.note)}</span><small>${e(v.time)}${v.review?' · flagged':''}</small></div>`).join('')}</details></article>`;}).join('')}</div><section class="timeline"><h2>Decision trail</h2>${[...state.history].reverse().map(h=>`<div class="timeline-row"><time>${time(h.time)}</time><i></i><p>${e(h.detail)}</p></div>`).join('')}</section>`;}
function method(a){return `<section class="page-title"><p class="eyebrow">OPEN THE BLACK BOX</p><h1>No mysterious score.<br><em>Just inspectable reasoning.</em></h1><p>A small, explicit model. Every assumption where you can see it.</p></section><div class="method-steps"><article><span>01</span><h2>Keep every plausible explanation</h2><p>Eight possibilities cover every subset of three branches, including none. A reading keeps an explanation only if its interval overlaps the predicted band.</p></article><article><span>02</span><h2>Choose a useful comparison</h2><p>Among affordable sites with confirmed access, choose the smallest worst-case set of remaining explanations. Ties prefer lower cost, then site ID.</p></article><article><span>03</span><h2>Make room for “unknown”</h2><p>Wide or conflicting readings stay visible. No matching explanation, no informative test, or flagged evidence produces an explicit stop or review state.</p></article></div><section class="model-panel"><div class="section-heading"><div><p class="eyebrow">THE COMPLETE PREDICTION TABLE</p><h2>What each explanation predicts</h2></div><span class="tag">${MODEL_VERSION}</span></div><p>Low = 0.03–0.12 · Elevated = 0.40–0.90 ${UNIT}. These are fictional test bands, <strong>not water-quality thresholds.</strong></p><div class="table-scroll"><table class="model-table"><thead><tr><th>Explanation</th>${SITES.map(s=>`<th>${s.id}<small>${s.short}</small></th>`).join('')}<th>Now</th></tr></thead><tbody>${HYPOTHESES.map(h=>`<tr class="${a.remaining.includes(h.id)?'':'excluded'}"><th>${e(h.name)}</th>${SITES.map(s=>`<td><span class="band ${expectedBand(h.id,s.id)[0]>.2?'elevated':'low-band'}">${expectedBand(h.id,s.id)[0]>.2?'Elevated':'Low'}</span></td>`).join('')}<td>${a.remaining.includes(h.id)?'Fits':'Excluded'}</td></tr>`).join('')}</tbody></table></div></section><div class="method-bottom"><section><h2>What this model assumes</h2><ul><li>Conditions stay stable during one short sampling session.</li><li>An active branch produces a detectable excess at connected sites.</li><li>The reference and all readings use the same declared method and units.</li><li>The test planner assumes ±0.03 measurement half-width, plus your configured extra tolerance of ±${fmt(state.tolerance)}.</li><li>Only the listed explanations exist in the model. Reality can contain others.</li></ul><button class="text-button" data-action="settings">Adjust assumptions ${icon('settings')}</button></section><section><h2>Where the prototype stops</h2><p>Trace does not model dilution, travel time, seasonal changes, lake mixing, chemical reactions, or field sampling error. It cannot establish safety, prove causation, identify a polluter, or detect a particular emerging contaminant.</p><p>Adaptive sampling is established practice. This project explores how transparent decisions, access constraints and revision history can make that workflow usable.</p><a class="text-button" href="https://www.epa.gov/n-steps-online/data-considerations" target="_blank" rel="noopener noreferrer">EPA: data comparability & context ↗</a></section></div>`;}
function report(a){return `<div class="report-toolbar"><div><p class="eyebrow">A CASE SOMEONE ELSE CAN FOLLOW</p><h1>The investigation, in full.</h1></div><button class="button primary" data-action="report-download">${icon('download')} Download report</button></div><p class="report-hint">Downloads a self-contained HTML report. Open it and use your browser’s Print → Save as PDF. Your JSON backup preserves the editable case.</p><article class="report-document">${reportBody(state)}</article>`;}
function render(){const a=analyze(state);app.innerHTML=`${header()}<main id="main">${storageWarning?`<div class="storage-warning" role="alert">${e(storageWarning)}</div>`:''}${tab==='investigate'?investigation(a):tab==='notebook'?notebook(a):tab==='method'?method(a):report(a)}</main><footer><span class="footer-brand">trace. <span>LESS GUESSWORK. BETTER QUESTIONS.</span></span><span>Fictional demonstration · Local browser storage · No API key</span><button class="text-button" data-action="reset">Reset case</button></footer>`;}
function openDialog(content,context=null){dialogContext=context;modal.innerHTML=`<button class="close-button" data-action="close" aria-label="Close dialog">${icon('close')}</button>${content}`;const heading=modal.querySelector('h2');if(heading){heading.id='dialog-title';modal.setAttribute('aria-labelledby','dialog-title');}modal.showModal();}
function sampleDialog(siteId,editId=null){const site=siteById(siteId),o=editId&&state.observations.find(o=>o.id===editId),r=o?latest(o):{low:'',high:'',note:'',review:false};
 openDialog(`<p class="eyebrow">${editId?'REVISE THE EVIDENCE':'RECORD A SYNTHETIC SAMPLE'}</p><h2>${e(site.name)}</h2><p>${editId?'The original stays in the history. Every conclusion will be recalculated.':`This uses ${site.cost} test credit${site.cost===1?'':'s'}. Record an interval, not false precision.`}</p>${!editId?`<button class="button secondary full" data-action="simulate">${icon('wave')} Use the scenario’s simulated reading</button>`:''}<form id="sample-form"><div class="form-row"><label>Lower bound <small>${UNIT}</small><input name="low" type="number" min="0" max="10" step="any" required value="${r.low}"></label><label>Upper bound <small>${UNIT}</small><input name="high" type="number" min="0" max="10" step="any" required value="${r.high}"></label></div><label>Field note <textarea name="note" maxlength="1000" rows="3" placeholder="What should the next reviewer know?">${e(r.note)}</textarea></label><label class="checkbox-label"><input name="review" type="checkbox" ${r.review?'checked':''}> Flag this reading for review; pause advice</label><p class="fineprint">Method: simulated colorimetry · phosphate as P. This workspace is a fictional test, not a field-validated measurement tool.</p><p class="form-error" role="alert"></p><button type="submit" class="button primary full">${editId?'Save revision':'Save reading'} ${icon('arrow')}</button></form>`,{siteId,editId});}
function settings(){openDialog(`<p class="eyebrow">CASE CONDITIONS</p><h2>Work with the constraints.</h2><p>Costs are illustrative credits. Changing a setting recalculates the plan and records the change.</p><form id="settings-form"><div class="form-row"><label>Total test budget<input name="budget" type="number" step="1" min="${analyze(state).spent}" max="20" value="${state.budget}" required></label><label>Extra tolerance ±<small>${UNIT}</small><input name="tolerance" type="number" step=".01" min="0" max=".2" value="${state.tolerance}" required></label></div><p class="fineprint">Tolerance widens every accepted interval. It is an assumption, not a fitted uncertainty estimate.</p><label class="checkbox-label"><input type="checkbox" name="conditions" ${state.conditionsChanged?'checked disabled':''}> Underlying water conditions or sampling session changed</label><p class="fineprint">Pauses new sampling in this case. Export it, then reset to begin a separate session; old readings are not carried forward.</p><h3>Access to each location</h3><div class="access-grid">${SITES.filter(s=>s.kind!=='reference'&&s.kind!=='outlet').map(s=>`<label><span>${s.id} · ${e(s.name)}</span><select name="access-${s.id}">${['open','unknown','blocked'].map(v=>`<option ${state.access[s.id]===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}</div><p class="fineprint">Only collect at sites explicitly marked open. Physical safety and local permissions require human judgment.</p><p class="form-error" role="alert"></p><button class="button primary full" type="submit">Update case conditions ${icon('check')}</button></form>`);}
function guide(){openDialog(`<p class="eyebrow">A TWO-MINUTE INVESTIGATION</p><h2>Follow a question upstream.</h2><ol class="guide-list"><li><strong>Start with what you know.</strong> A reference and combined-inflow reading are already in the notebook.</li><li><strong>Choose the next useful test.</strong> The orange point is recommended. Select any map point to compare.</li><li><strong>Collect a simulated reading.</strong> Save its full interval and see which explanations remain.</li><li><strong>Challenge the result.</strong> Revise a reading, block a path, or try “When the story breaks.” The model must respond honestly.</li><li><strong>Leave an understandable record.</strong> Export the case with its assumptions, uncertainty and original readings.</li></ol><p class="notice">This is a fictional training demonstration. It makes no field-validated source or safety claims.</p><button class="button primary full" data-action="close">Explore the case ${icon('arrow')}</button>`);}
function why(){const a=analyze(state),r=a.actions[0];if(!r)return;openDialog(`<p class="eyebrow">THE REASONING</p><h2>Why ${e(r.site.name.toLowerCase())}?</h2><p>${e(r.site.description)}</p><div class="reason-stat">${a.remaining.length} <span>→</span> ≤${r.worstRemaining}</div><p>For a reading with half-width 0.03 ${UNIT}, the largest compatible group drops to ${r.worstRemaining}. This includes extra tolerance of ±${state.tolerance}.</p><ul><li>${r.low} explanations predict the low band.</li><li>${r.high} predict the elevated band.</li><li>The site is marked open and costs ${r.site.cost} credit(s).</li></ul><p>The planner minimizes the worst remaining group; equal scores prefer lower cost, then site ID. It does not know the hidden scenario outcome.</p><p class="notice">A broad interval may narrow nothing. An unexpected reading may invalidate the model. Neither is silently forced into a convenient result.</p><button class="button primary full" data-sample="${r.site.id}">Record this sample ${icon('arrow')}</button>`);}
function confirmReset(id=state.scenarioId){openDialog(`<p class="eyebrow">START A FRESH INVESTIGATION</p><h2>${e(scenarioById(id).name)}</h2><p>${e(scenarioById(id).description)}</p><p class="notice">This replaces the current case in browser storage. Download a backup first if you want to keep its readings and history.</p><div class="modal-actions"><button class="button secondary" data-action="backup">Download backup</button><button class="button primary" data-reset="${id}">Start fresh ${icon('arrow')}</button></div>`);}
function download(name,contents,type){const url=URL.createObjectURL(new Blob([contents],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function changeTab(next){tab=next;render();focusContent();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-action],[data-tab],[data-site],[data-sample],[data-edit],[data-reset]');if(!b)return;
 if(b.disabled)return;
 try {
 if(b.dataset.tab){changeTab(b.dataset.tab);return;}
 if(b.dataset.site){selected=b.dataset.site;render();const pin=app.querySelector(`[data-site="${selected}"]`);if(event.detail===0)pin?.focus();return;}
 if(b.dataset.sample){if(modal.open)modal.close();sampleDialog(b.dataset.sample);return;}
 if(b.dataset.edit){const o=state.observations.find(o=>o.id===b.dataset.edit);sampleDialog(o.siteId,o.id);return;}
 if(b.dataset.reset){modal.close();selected='A';tab='investigate';save(createCase(b.dataset.reset),'Fresh case ready.');return;}
 switch(b.dataset.action){
 case 'home':event.preventDefault();changeTab('investigate');break;
 case 'close':modal.close();break;
 case 'settings':settings();break;
 case 'guide':guide();break;
 case 'why':why();break;
 case 'reset':confirmReset();break;
 case 'simulate':{const r=simulatedReading(state.scenarioId,dialogContext.siteId),f=$('#sample-form');f.elements.low.value=r.low;f.elements.high.value=r.high;f.elements.note.value=r.note;f.elements.review.checked=false;f.querySelector('.form-error').textContent='';break;}
 case 'backup':download('trace-'+state.scenarioId+'.json',serializeCase(state),'application/json');toast('Backup downloaded.');break;
 case 'report-download':download('trace-investigation-report.html',renderReport(state),'text/html;charset=utf-8');toast('Report downloaded.');break;
 case 'import':$('#import-file').click();break;
 }
 }catch(err){toast(err.message);}
});
document.addEventListener('keydown',event=>{const pin=event.target.closest('.map-pin');if(pin&&(event.key==='Enter'||event.key===' ')){event.preventDefault();selected=pin.dataset.site;render();app.querySelector(`[data-site="${selected}"]`)?.focus();}});
document.addEventListener('change',event=>{if(event.target.id==='location-picker'){selected=event.target.value;render();$('#location-picker').focus({preventScroll:true});return;}if(event.target.id==='scenario'){const id=event.target.value;event.target.value=state.scenarioId;confirmReset(id);}});
document.addEventListener('submit',event=>{
 if(!['sample-form','settings-form'].includes(event.target.id))return;event.preventDefault();const f=event.target;
 try{let next;
 if(f.id==='sample-form'){const r={low:Number(f.elements.low.value),high:Number(f.elements.high.value),method:METHOD,note:f.elements.note.value,review:f.elements.review.checked};next=dialogContext.editId?reviseSample(state,dialogContext.editId,r):recordSample(state,dialogContext.siteId,r);selected=dialogContext.siteId;}
 else{next=state;if(f.elements.conditions.checked)next=markConditionsChanged(next);const budget=Number(f.elements.budget.value),tol=Number(f.elements.tolerance.value);if(budget!==state.budget)next=setBudget(next,budget);if(tol!==state.tolerance)next=setTolerance(next,tol);for(const site of SITES){const el=f.elements['access-'+site.id];if(el&&el.value!==next.access[site.id])next=setAccess(next,site.id,el.value);}}
 modal.close();save(next,f.id==='sample-form'?'Evidence saved. The case has been recalculated.':'Case conditions updated.');
 }catch(err){f.querySelector('.form-error').textContent=err.message;}
});
$('#import-file').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;try{if(file.size>MAX_BACKUP_BYTES)throw new Error('Backup is too large.');const imported=importCase(await file.text());openDialog(`<p class="eyebrow">RESTORE A CASE</p><h2>Import ${e(scenarioById(imported.scenarioId).name)}?</h2><p>This replaces the open case. Save its backup before continuing.</p><div class="modal-actions"><button class="button secondary" data-action="backup">Back up current</button><button class="button primary" id="confirm-import">Restore case</button></div>`);$('#confirm-import').addEventListener('click',()=>{modal.close();selected='A';save(imported,'Case restored with full revision history.');});}catch(err){toast(err.message);}});
modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)modal.close();}});
render();


})();</script></body>
</html>
